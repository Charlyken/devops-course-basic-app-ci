name: devops-course-basic-app-ci
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 Déclenché par un événement ${{ github.event_name }}."
      - run: echo "🐧 Job sur un runner ${{ runner.os }} hébergé par GitHub."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 Le repo ${{ github.repository }} a été cloné sur le runner."
      - name: List files in the repository
        run: ls ${{ github.workspace }}
      - run: 'echo "🍏 Statut du job : ${{ job.status }}."'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository code
        uses: actions/checkout@v4
      - name: set uo python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.14.5'
      - name: Display python-version
        run: python -c "import sys; print(sys.version)"
      - name: install dependencies
        run: pip install -r requirements.txt 
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov 
          pytest awsip_test.py  --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html